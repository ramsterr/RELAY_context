name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: unit tests
        run: python -m pytest -q
      - name: packer still finds the optimum
        run: python scripts/repro_knapsack.py
      - name: plugin handshake over stdio
        run: python scripts/mcp_smoke.py

  library-only:
    name: library installs without the plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install with no extras
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: library imports and works
        run: |
          python -c "import context_handover; print(context_handover.__version__)"
          python -c "from context_handover.storage import create_backend; print(type(create_backend()).__name__)"
          python -c "from context_handover.core.budget import TokenBudgetManager; print(TokenBudgetManager().count('hello world'))"
      - name: relay-mcp explains how to install the extra
        run: |
          if relay-mcp --check; then
            echo "relay-mcp should not run without the mcp extra"; exit 1
          fi
          relay-mcp --check 2>&1 | grep -q 'context-handover\[mcp\]'
