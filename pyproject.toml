[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-handover"
version = "0.2.0"
description = "Typed semantic atoms, drift measurement and budgeted handover across LLM sessions, with an MCP server for agent plugins"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ramster", email = "ramsterr@users.noreply.github.com"}
]
keywords = ["llm", "context", "handover", "memory", "session", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.4.0"]
qdrant = ["qdrant-client>=1.7.0"]
observability = [
    "langfuse>=2.0.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "langfuse>=2.0.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.scripts]
relay-mcp = "context_handover.mcp.server:main"
relay = "context_handover.cli:main"

[project.urls]
Homepage = "https://github.com/ramsterr/RELAY_context"
Repository = "https://github.com/ramsterr/RELAY_context"
Issues = "https://github.com/ramsterr/RELAY_context/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_handover = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
